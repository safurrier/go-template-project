version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cbb
      POSTGRES_USER: cbb
      POSTGRES_PASSWORD: cbb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ingest:
    build:
      context: ..
      target: ingest
    environment:
      DATABASE_URL: postgres://cbb:cbb@postgres:5432/cbb?sslmode=disable
      INGEST_CSV: seed/arizona_games.csv
    depends_on:
      - postgres

  api:
    build:
      context: ..
      target: api
    environment:
      DATABASE_URL: postgres://cbb:cbb@postgres:5432/cbb?sslmode=disable
      PORT: 8080
    depends_on:
      - postgres
      - ingest
    ports:
      - "8080:8080"

volumes:
  postgres_data:
